# Build the Shiny app to WebAssembly and publish it to GitHub Pages.
#
# The result is a static site: R runs inside the visitor's browser via webR, so
# there is no server, nothing to pay for, and uploaded genotypes never leave
# the machine they were uploaded from.
#
# Push to main and this runs. First build takes a few minutes, later ones are
# faster because the R library is cached.

name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::DT
            any::ggplot2
            any::igraph

      - name: Export app to WebAssembly
        run: |
          shinylive::export("app", "_site",
                            template_params = list(title = "genoID"))
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
